[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-engine"
version = "0.2.0"
description = "Open-source business simulation engine for classroom use (industry-agnostic, scenario-driven)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "../LICENSE-CODE" }
authors = [
    { name = "solar-sim contributors" },
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]
